name: Desktop Release

on:
  push:
    branches: ["main"]
    paths:
      - "RELEASE.md"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  installers:
    needs: validate
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [validate, installers]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download installers and updater metadata
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Ensure version tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          FILES=(installers/**/*)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KERN $RELEASE_TAG — Stable" \
              --notes-file RELEASE.md \
              --latest
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KERN $RELEASE_TAG — Stable" \
              --notes-file RELEASE.md \
              --latest
          fi
