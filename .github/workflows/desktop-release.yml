name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installers:
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: installers

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Download installers and updater metadata
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          FILES=(installers/**/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KERN $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
